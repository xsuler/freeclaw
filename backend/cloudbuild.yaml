steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/freeclaw-backend:$COMMIT_SHA', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/freeclaw-backend:$COMMIT_SHA']

  # Deploy container to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'freeclaw-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/freeclaw-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GCS_BUCKET=freeclaw-tasks'

images:
  - 'gcr.io/$PROJECT_ID/freeclaw-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
